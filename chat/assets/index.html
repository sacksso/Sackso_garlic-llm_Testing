<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garlic LLM · PS4</title>
<style>
:root{--bg:#0b1220;--panel:#111b30;--line:#22304d;--text:#e8eefc;--dim:#8fa1c4;--accent:#6ea8ff;--user:#1d3a6b;--ok:#4cd694;--bad:#ff6b6b}
@media (prefers-color-scheme: light){:root{--bg:#f4f6fb;--panel:#fff;--line:#d5dbea;--text:#15213a;--dim:#5b6b8c;--accent:#2a62d6;--user:#dbe7ff;--ok:#1a9e63;--bad:#d63a3a}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:17px;margin:0;flex:1}
header .st{font-size:13px;color:var(--dim)}
button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
button:hover{border-color:var(--accent)}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.5;cursor:default}
#log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:min(760px,92%);padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--user)}
.msg.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
.msg.err{align-self:center;color:var(--bad);border:1px solid var(--bad);background:transparent;font-size:14px}
.msg .meta{display:block;color:var(--dim);font-size:12px;margin-top:6px}
.msg pre{background:rgba(127,127,127,.15);padding:8px 10px;border-radius:8px;overflow-x:auto;margin:6px 0;white-space:pre}
.msg code{font-family:ui-monospace,Consolas,monospace;font-size:14px}
.empty{margin:auto;text-align:center;color:var(--dim);max-width:460px}
form{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:var(--panel)}
textarea{flex:1;resize:none;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 12px;max-height:160px}
textarea:focus{outline:none;border-color:var(--accent)}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;max-width:min(560px,94vw);width:100%}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog h2{margin:0 0 8px;font-size:17px}
label{display:block;margin:10px 0 4px;color:var(--dim);font-size:13px}
input,dialog textarea{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.url{display:flex;gap:6px;align-items:center;margin:4px 0}.url code{flex:1;overflow-x:auto;white-space:nowrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:13px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
small{color:var(--dim)}
</style>
</head>
<body>
<header>
  <h1>🧄 Garlic LLM <span class="st" id="model"></span></h1>
  <span class="st" id="state"></span>
  <button id="bNew" type="button"></button>
  <button id="bSet" type="button">⚙</button>
</header>
<div id="log"></div>
<form id="form">
  <textarea id="box" rows="1" autocomplete="off"></textarea>
  <button class="primary" id="bSend" type="submit"></button>
</form>

<dialog id="dlg">
  <h2 id="tSet"></h2>
  <label id="lSys"></label><textarea id="sys" rows="3"></textarea>
  <label id="lTemp"></label><input id="temp" type="number" min="0" max="2" step="0.1">
  <label id="lMax"></label><input id="max" type="number" min="16" max="4096" step="16">
  <label id="lKey"></label><input id="key" type="password" autocomplete="off">
  <h2 style="margin-top:18px" id="tConn"></h2>
  <small id="hConn"></small>
  <div id="urls"></div>
  <div class="row"><button id="bOk" class="primary" type="button"></button></div>
</dialog>

<script>
"use strict";
var ES = (navigator.language || "es").toLowerCase().indexOf("es") === 0;
function T(es, en) { return ES ? es : en; }
var $ = function (id) { return document.getElementById(id); };
var LS = {
  get: function (k, d) { try { var v = localStorage.getItem("garlic." + k); return v === null ? d : v; } catch (e) { return d; } },
  set: function (k, v) { try { localStorage.setItem("garlic." + k, v); } catch (e) {} }
};
var convo = [];            // {role, content}
var busy = false, ctl = null;

try { convo = JSON.parse(LS.get("convo", "[]")) || []; } catch (e) { convo = []; }
$("sys").value = LS.get("sys", T("Eres un asistente útil. Responde en el idioma del usuario.", "You are a helpful assistant. Answer in the user's language."));
$("temp").value = LS.get("temp", "0.7");
$("max").value = LS.get("max", "512");
$("key").value = LS.get("key", "");

$("bNew").textContent = T("Nuevo", "New");
$("bSend").textContent = T("Enviar", "Send");
$("box").placeholder = T("Escribe y pulsa Enter (Shift+Enter: salto de línea)", "Type and press Enter (Shift+Enter: new line)");
$("tSet").textContent = T("Ajustes", "Settings");
$("lSys").textContent = T("Instrucciones del sistema", "System prompt");
$("lTemp").textContent = T("Temperatura (0–2)", "Temperature (0–2)");
$("lMax").textContent = T("Tokens máximos de respuesta", "Max reply tokens");
$("lKey").textContent = T("Clave de la API (solo si /data/garlic_api_key.txt existe)", "API key (only if /data/garlic_api_key.txt exists)");
$("tConn").textContent = T("Conectar otras apps o juegos", "Connect other apps or games");
$("hConn").textContent = T("Escribe estas direcciones en la app o el juego (misma red Wi-Fi):", "Type these addresses into the app or game (same Wi-Fi network):");
$("bOk").textContent = T("Cerrar", "Close");

function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

// text with ``` blocks: the blocks go in <pre><code>, the rest stays plain text
function fill(node, text) {
  node.textContent = "";
  var parts = text.split("```");
  for (var i = 0; i < parts.length; i++) {
    if (i % 2 === 1) {
      var body = parts[i], nl = body.indexOf("\n");
      if (nl >= 0 && nl < 24 && body.slice(0, nl).trim().indexOf(" ") < 0) body = body.slice(nl + 1);
      var pre = el("pre"), code = el("code", null, body.replace(/\n$/, ""));
      pre.appendChild(code); node.appendChild(pre);
    } else if (parts[i]) node.appendChild(document.createTextNode(parts[i]));
  }
}

function render() {
  var log = $("log");
  log.textContent = "";
  if (!convo.length) {
    var e = el("div", "empty");
    e.appendChild(el("p", null, T("Chat con el modelo que corre en tu PS4. Escribe abajo.", "Chat with the model running on your PS4. Type below.")));
    e.appendChild(el("p", null, T("Cada respuesta tarda unos segundos en empezar: la consola lee primero todo el texto.", "Each reply takes a few seconds to start: the console reads the whole text first.")));
    log.appendChild(e);
    return;
  }
  convo.forEach(function (m) {
    var d = el("div", "msg " + (m.role === "user" ? "user" : "ai"));
    fill(d, m.content);
    log.appendChild(d);
  });
  log.scrollTop = log.scrollHeight;
}

function addErr(text) { var d = el("div", "msg err", text); $("log").appendChild(d); $("log").scrollTop = $("log").scrollHeight; }
function headers() {
  var h = { "Content-Type": "application/json" }, k = $("key").value.trim();
  if (k) h["Authorization"] = "Bearer " + k;
  return h;
}

function setBusy(b) {
  busy = b;
  $("bSend").textContent = b ? T("Detener", "Stop") : T("Enviar", "Send");
  $("state").textContent = b ? T("pensando…", "working…") : "";
}

function save() { LS.set("convo", JSON.stringify(convo.slice(-60))); }

function send(text) {
  convo.push({ role: "user", content: text });
  var d = el("div", "msg ai", "…");
  render(); $("log").appendChild(d);
  var msgs = [], sys = $("sys").value.trim();
  if (sys) msgs.push({ role: "system", content: sys });
  convo.forEach(function (m) { msgs.push(m); });
  var body = JSON.stringify({ messages: msgs, stream: true, temperature: parseFloat($("temp").value) || 0.7, max_tokens: parseInt($("max").value, 10) || 512 });
  ctl = new AbortController();
  setBusy(true);
  var t0 = Date.now(), t1 = 0, count = 0, reply = "";
  fetch("/v1/chat/completions", { method: "POST", headers: headers(), body: body, signal: ctl.signal }).then(function (r) {
    if (!r.ok) return r.json().catch(function () { return {}; }).then(function (j) { throw new Error((j.error && j.error.message) || ("HTTP " + r.status)); });
    var rd = r.body.getReader(), dec = new TextDecoder(), buf = "";
    function pump() {
      return rd.read().then(function (x) {
        if (x.done) return;
        buf += dec.decode(x.value, { stream: true });
        var lines = buf.split("\n"); buf = lines.pop();
        lines.forEach(function (ln) {
          if (ln.indexOf("data: ") !== 0) return;
          var p = ln.slice(6);
          if (p === "[DONE]") return;
          try {
            var j = JSON.parse(p);
            if (j.error) throw new Error(j.error.message);
            var c = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
            if (c) { if (!t1) t1 = Date.now(); reply += c; count++; fill(d, reply); $("log").scrollTop = $("log").scrollHeight; }
          } catch (e) { if (e instanceof SyntaxError) return; throw e; }
        });
        return pump();
      });
    }
    return pump();
  }).then(function () {
    if (reply) {
      convo.push({ role: "assistant", content: reply });
      var s = (Date.now() - (t1 || t0)) / 1000;
      var meta = el("span", "meta", T("1.er token a los ", "first token after ") + (((t1 || Date.now()) - t0) / 1000).toFixed(1) + " s" + (count > 1 && s > 0 ? " · ~" + (count / s).toFixed(1) + " tok/s" : ""));
      d.appendChild(meta);
    } else { d.remove(); }
  }).catch(function (e) {
    if (reply) convo.push({ role: "assistant", content: reply });
    else d.remove();
    if (e.name !== "AbortError") addErr(String(e.message || e) + (String(e.message).indexOf("busy") >= 0 ? T(" — espera a que termine la otra petición.", " — wait for the other request to finish.") : ""));
  }).then(function () { setBusy(false); ctl = null; save(); });
}

$("form").addEventListener("submit", function (ev) {
  ev.preventDefault();
  if (busy) { if (ctl) ctl.abort(); return; }
  var t = $("box").value.trim();
  if (!t) return;
  $("box").value = ""; $("box").style.height = "auto";
  send(t);
});
$("box").addEventListener("keydown", function (ev) {
  if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); $("form").requestSubmit(); }
});
$("box").addEventListener("input", function () { this.style.height = "auto"; this.style.height = Math.min(this.scrollHeight, 160) + "px"; });
$("bNew").addEventListener("click", function () { if (busy && ctl) ctl.abort(); convo = []; save(); render(); });
["sys", "temp", "max", "key"].forEach(function (id) { $(id).addEventListener("change", function () { LS.set(id, $(id).value); }); });
$("bSet").addEventListener("click", function () { $("dlg").showModal(); });
$("bOk").addEventListener("click", function () { $("dlg").close(); });

// the addresses for other apps (this page came from the console, so its address is the console's)
(function () {
  var o = location.origin, box = $("urls");
  [["OpenAI", o + "/v1"], ["Ollama", o], ["KoboldCpp", o]].forEach(function (u) {
    var row = el("div", "url"), lab = el("small", null, u[0]), code = el("code", null, u[1]), b = el("button", null, T("Copiar", "Copy"));
    lab.style.width = "72px";
    b.type = "button";
    b.addEventListener("click", function () {
      var done = function () { b.textContent = "✓"; setTimeout(function () { b.textContent = T("Copiar", "Copy"); }, 1200); };
      if (navigator.clipboard) navigator.clipboard.writeText(u[1]).then(done, function () {}); else { var r = document.createRange(); r.selectNodeContents(code); getSelection().removeAllRanges(); getSelection().addRange(r); }
    });
    row.appendChild(lab); row.appendChild(code); row.appendChild(b); box.appendChild(row);
  });
})();

fetch("/v1/models", { headers: headers() }).then(function (r) { return r.json(); }).then(function (j) {
  if (j.data && j.data[0]) $("model").textContent = "· " + j.data[0].id;
}).catch(function () {});

render();
</script>
</body>
</html>
